<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>회복실 인계 노트</title>
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#1D2733;--ink2:#46525F;--mut:#5E6B78;--line:#D9E0E7;--pri:#1F5F8B;--pri2:#E5EFF7;--nur:#2F6B4F;--nur2:#E4F1EA;--new:#B3261E;--mark:#FFF1A8}
@media (prefers-color-scheme:dark){:root{--bg:#12171D;--card:#1B222A;--ink:#E7ECF1;--ink2:#C3CCD5;--mut:#A3AFBB;--line:#2E3843;--pri:#7FB6E0;--pri2:#1E2E3C;--nur:#86C9A6;--nur2:#1C2E25;--new:#FF8A80;--mark:#5A4E10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;margin:10px 0 8px;flex-wrap:wrap}
.tab{flex:1;min-width:96px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 6px;font-size:15px;font-weight:700;cursor:pointer}
.tab.on[data-v=prof]{background:var(--pri);border-color:var(--pri);color:#fff}
.tab.on[data-v=nurse]{background:var(--nur);border-color:var(--nur);color:#fff}
.tab.on[data-v=date],.tab.on[data-v=new]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tools{display:flex;gap:6px}
.tools input,.tools select{font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.tools input{flex:1;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:20px;padding:5px 11px;font-size:13.5px;cursor:pointer}
.chip b{color:var(--mut);font-weight:600;margin-left:3px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
section>h2{margin:0;font-size:17px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
section.prof>h2{background:var(--pri2);color:var(--pri)}
section.nurse>h2{background:var(--nur2);color:var(--nur)}
section.date>h2{background:var(--bg)}
h2 small{font-size:12.5px;color:var(--mut);font-weight:600}
h3{font-size:13.5px;color:var(--mut);margin:10px 14px 0}
ul{list-style:none;margin:0;padding:4px 0}
li{padding:9px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
li:first-child{border-top:0}
.d{flex:none;display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:62px}
.dt{font-size:12.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.dt.nw{background:var(--new);color:#fff}
.tx{flex:1}
.tx .g{display:inline-block;font-size:12.5px;font-weight:700;color:var(--pri);margin-right:6px}
.tx .g.n{color:var(--nur)}
.tx .s{font-size:12.5px;color:var(--mut);margin-right:4px}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}
.warn{color:var(--new);font-weight:700}
.note{font-size:13px;color:var(--ink2);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:14px 0}
.empty{text-align:center;color:var(--mut);padding:40px 0}
#gate{max-width:380px;margin:18vh auto 0;padding:0 16px;text-align:center}
#gate input{width:100%;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--line);margin:14px 0 8px;background:var(--card);color:var(--ink)}
#gate button,.btn{font-size:16px;font-weight:700;padding:11px 18px;border-radius:12px;border:0;background:var(--pri);color:#fff;cursor:pointer;width:100%}
#gate label{font-size:13.5px;color:var(--ink2)}
#gerr{color:var(--new);min-height:1.4em;font-size:14px}
.top{position:fixed;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:18px;cursor:pointer;opacity:.85}
@media (max-width:560px){header{position:static}.tab{min-width:0;font-size:13.5px;padding:8px 2px}.tabs{flex-wrap:nowrap}h1{font-size:18px}li{flex-direction:column;gap:4px}.d{flex-direction:row;flex-wrap:wrap;min-width:0}}
</style>
</head>
<body>
<div id="gate">
  <h1>🔒 회복실 인계 노트</h1>
  <div class="sub">같이 일하는 선생님만 보는 화면이에요.<br>단톡방에서 받은 비밀번호를 넣어 주세요.</div>
  <form id="gf"><input id="gpw" type="password" autocomplete="current-password" placeholder="비밀번호">
  <div id="gerr"></div>
  <button type="submit">열기</button>
  <p><label><input type="checkbox" id="grem"> 이 기기에서 기억하기 (내 휴대폰만)</label></p></form>
</div>
<div class="wrap" id="app" hidden>
  <header>
    <h1 id="ttl">회복실 인계 노트</h1>
    <div class="sub" id="srcl"></div>
    <div class="tabs">
      <button class="tab" data-v="prof">👨‍⚕️ 교수님별</button>
      <button class="tab" data-v="nurse">🩺 간호사끼리</button>
      <button class="tab" data-v="date">📅 날짜별</button>
      <button class="tab" data-v="new">🆕 최근 3달</button>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="찾기 (예: byfavo, 장갑, 소아)">
      <select id="sort" title="정렬"><option value="new">최신 먼저</option><option value="old">오래된 것 먼저</option></select>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="list"></main>
  <div class="note">
    · 괄호 안 날짜는 그 내용이 나온 달이에요. 같은 항목이 바뀐 경우 <b>가장 최근 날짜가 지금 기준</b>이에요.<br>
    · 🆕 빨간 날짜 = 최근 3달 안에 새로 나오거나 바뀐 것.<br>
    · 26.2부터 교수님 인계사항·월별 인계는 밴드에도 올라가요. 여기 없는 내용은 밴드에서 확인해 주세요.<br>
    · 환자 정보는 절대 적지 않아요. <a href="#" id="lock">🔒 이 기기에서 잠그기</a>
  </div>
</div>
<button class="top" id="top" title="맨 위로" hidden>↑</button>
<script src="data.enc.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s), K='handoff.pw';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const E=window.HANDOFF_ENC, enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:E.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,b64(E.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
let D=null, V='prof', F='', Q='';
try{V=localStorage.getItem('handoff.view')||'prof'}catch(e){}
async function tryOpen(pw,rem){
  try{D=await open(pw)}catch(e){$('#gerr').textContent='비밀번호가 맞지 않아요.';return}
  if(rem){try{localStorage.setItem(K,pw)}catch(e){}}
  $('#gate').hidden=true;$('#app').hidden=false;$('#top').hidden=false;
  $('#ttl').textContent=D.title+' 노트';$('#srcl').textContent=D.src+' · 화면 업데이트 '+D.upd;
  draw();
}
$('#gf').onsubmit=e=>{e.preventDefault();tryOpen($('#gpw').value.trim(),$('#grem').checked)};
try{const s=localStorage.getItem(K);if(s)tryOpen(s,false)}catch(e){}
$('#lock').onclick=e=>{e.preventDefault();try{localStorage.removeItem(K)}catch(x){}location.reload()};
$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{V=b.dataset.v;F='';try{localStorage.setItem('handoff.view',V)}catch(e){}draw();scrollTo({top:0})});
$('#q').oninput=e=>{Q=e.target.value.trim().toLowerCase();draw()};
$('#sort').onchange=draw;

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ym=d=>{const [y,m]=d.split('-');return y.slice(2)+'.'+(+m)};
const ymL=d=>{const [y,m]=d.split('-');return y+'년 '+(+m)+'월'};
function recent(){const n=new Date();const c=new Date(n.getFullYear(),n.getMonth()-2,1);return c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')}
function fmt(t){
  let h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^⚠/,'<span class="warn">⚠</span>');
  if(Q){const re=new RegExp('('+Q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');h=h.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(re,'<mark>$1</mark>'))}
  return h;
}
const last=i=>i.d.length?i.d[i.d.length-1]:'0000';
function li(i,showG){
  const R=recent();
  const ds=i.d.length?i.d.slice().reverse().map(d=>`<span class="dt${d>=R?' nw':''}">${d>=R?'🆕 ':''}${ym(d)}</span>`).join(''):'<span class="dt">날짜 없음</span>';
  const g=showG?`<span class="g${i.p==='nurse'?' n':''}">${esc(i.g)}</span>`:'';
  const s=i.s?`<span class="s">[${esc(i.s)}]</span>`:'';
  return `<li><div class="d">${ds}</div><div class="tx">${g}${s}${fmt(i.t)}</div></li>`;
}
function draw(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===V));
  const desc=$('#sort').value==='new';
  let it=D.it.filter(i=>!Q||(i.t+' '+i.g+' '+i.s).toLowerCase().includes(Q));
  const L=$('#list'),C=$('#chips');let h='',ch='';
  const cmp=(a,b)=>desc?last(b).localeCompare(last(a)):last(a).localeCompare(last(b));
  if(V==='prof'||V==='nurse'){
    const part=it.filter(i=>i.p===V),groups=[];
    part.forEach(i=>{if(!groups.includes(i.g))groups.push(i.g)});
    D.it.filter(i=>i.p===V).forEach(i=>{if(!groups.includes(i.g)&&!Q)groups.push(i.g)});
    ch=groups.map(g=>`<button class="chip" data-g="${esc(g)}">${esc(g.replace(' 교수님',''))}<b>${part.filter(i=>i.g===g).length}</b></button>`).join('');
    groups.forEach((g,n)=>{const a=part.filter(i=>i.g===g).sort(cmp);if(!a.length)return;
      const subs=[...new Set(a.map(i=>i.s))];
      let body=subs.map(s=>(s?`<h3>${esc(s)}</h3>`:'')+'<ul>'+a.filter(i=>i.s===s).map(i=>li(i,false)).join('')+'</ul>').join('');
      h+=`<section class="${V}" id="g${n}" data-g="${esc(g)}"><h2>${esc(g)}<small>${a.length}개 · 최근 ${ym(last(a.slice().sort((x,y)=>last(y).localeCompare(last(x)))[0]))}</small></h2>${body}</section>`});
  }else{
    const R=recent();
    if(V==='new')it=it.filter(i=>i.d.some(d=>d>=R));
    const months=[...new Set(it.flatMap(i=>i.d))].sort();if(desc)months.reverse();
    const nod=it.filter(i=>!i.d.length);
    ch=months.map(m=>`<button class="chip" data-m="${m}">${ym(m)}<b>${it.filter(i=>i.d.includes(m)).length}</b></button>`).join('');
    months.forEach(m=>{const a=it.filter(i=>i.d.includes(m));
      const pa=a.filter(i=>i.p==='prof'),na=a.filter(i=>i.p==='nurse');
      h+=`<section class="date" id="m${m}"><h2>${ymL(m)}<small>교수님 ${pa.length} · 간호사 ${na.length}</small></h2>`+
        (pa.length?'<h3>👨‍⚕️ 교수님별</h3><ul>'+pa.map(i=>li(i,true)).join('')+'</ul>':'')+
        (na.length?'<h3>🩺 간호사끼리</h3><ul>'+na.map(i=>li(i,true)).join('')+'</ul>':'')+'</section>'});
    if(nod.length&&V==='date')h+=`<section class="date"><h2>날짜 없는 공지<small>${nod.length}개</small></h2><ul>${nod.map(i=>li(i,true)).join('')}</ul></section>`;
  }
  L.innerHTML=h||'<div class="empty">찾는 내용이 없어요.</div>';C.innerHTML=ch;
  C.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const el=c.dataset.g?L.querySelector(`section[data-g="${CSS.escape(c.dataset.g)}"]`):document.getElementById('m'+c.dataset.m);
    if(el){const off=document.querySelector('header').offsetHeight+8;scrollTo({top:el.getBoundingClientRect().top+scrollY-off,behavior:'smooth'})}});
}
})();
</script>
</body>
</html>
