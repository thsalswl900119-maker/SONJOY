<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>카페스이 운영노트</title>
<style>
  :root{--bg:#f6f2ea;--card:#fff;--ink:#2b2622;--muted:#7a716a;--line:#e6ded2;--accent:#e8735a;--accent2:#5a7d6a;--red:#c0392b;--blue:#2471a3;--soft:#fbf7f0;--warn:#fff1ec;--nav:64px}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0;white-space:nowrap;display:flex;align-items:center;gap:8px}header .hlogo{width:26px;height:26px}
  header h1 small{color:var(--muted);font-weight:400;margin-left:6px;font-size:11px}
  header .me{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
  nav.top{display:flex;gap:4px;flex-wrap:wrap}
  nav.top button,nav.bottom button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--ink);font-family:inherit}
  nav.top button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  nav.bottom{display:none}
  main{max-width:1240px;margin:0 auto;padding:14px 14px calc(var(--nav) + 20px)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h3{font-size:13px;margin:14px 0 6px;color:var(--muted)}
  .sp{flex:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .grid .w2{grid-column:span 2}.grid .w3{grid-column:span 3}
  @media(max-width:520px){.grid .w2,.grid .w3{grid-column:span 2}.grid{grid-template-columns:1fr 1fr}}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],input[type=time],input[type=password],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 9px;font:inherit;background:#fff;color:var(--ink);font-size:14px}
  input[type=number]{text-align:right}
  textarea{min-height:110px;resize:vertical;line-height:1.6}
  textarea.tall{min-height:220px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.sec{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn.big{padding:16px 20px;font-size:16px;font-weight:600;flex:1}
  .btn.danger{color:var(--red)}
  .btn:disabled{opacity:.5;cursor:default}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  th{background:var(--soft);font-weight:600;white-space:nowrap}
  td.num{text-align:right;white-space:nowrap}
  td input,td select{padding:5px 7px}
  tr.need td{background:var(--warn)}
  .wrap{overflow-x:auto}
  .tip{font-size:12px;color:var(--muted)}
  .tipbox{font-size:12px;background:var(--soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0;white-space:pre-line}
  .tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;background:var(--soft);color:var(--muted);margin-left:4px;white-space:nowrap}
  .tag.red{background:#fde8e5;color:var(--red)}
  .tag.green{background:#e6f0ea;color:var(--accent2)}
  .tag.blue{background:#e5eef7;color:var(--blue)}
  .memo-tags .btn{padding:6px 10px}
  .memo-view{white-space:pre-wrap;line-height:1.7;font-size:13px;background:var(--soft);border-radius:8px;padding:12px;min-height:50px}
  .memo-view .r{color:var(--red);font-weight:600}.memo-view .b{color:var(--blue);font-weight:600}.memo-view .s{font-weight:700}
  .list{display:flex;flex-direction:column;gap:4px;max-height:380px;overflow:auto}
  .list button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
  .list button.on{border-color:var(--accent);background:#fff4f0}
  .list button small{color:var(--muted);display:block;font-size:11px}
  .two{display:grid;grid-template-columns:250px 1fr;gap:14px}.two.half{grid-template-columns:1fr 1fr}
  @media(max-width:820px){.two,.two.half{grid-template-columns:1fr}}
  .faint{font-size:10px;color:#b5aca3;font-weight:400;margin-left:6px}details.tipd summary.faint{font-size:10px;color:#b5aca3}p.faint{margin:2px 0 0}
  .done{color:var(--accent2);font-weight:600}.due{color:var(--red);font-weight:600}
  .kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:10px}
  .kpi div{background:var(--soft);border-radius:10px;padding:8px 10px}
  .kpi b{display:block;font-size:17px}.kpi span{font-size:11px;color:var(--muted)}
  .stock{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
  .stock .it{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;background:#fff}
  .stock .it.need{border-color:var(--accent);background:var(--warn)}
  .stock .it .nm{flex:1;font-size:13px;line-height:1.2}.stock .it .nm small{display:block;color:var(--muted);font-size:10.5px}
  .stock .it input{width:64px;padding:4px 6px}.stock .it .u{font-size:11px;color:var(--muted);width:22px}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:12px;text-align:center}
  .week div{background:var(--soft);border-radius:6px;padding:4px}.week div b{display:block}.week div.tot{background:#e6f0ea}
  details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;background:#fff}
  summary{cursor:pointer;font-weight:600;font-size:13px}
  .season td.now{background:#e6f0ea;font-weight:600}
  /* 달력 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal .hd{font-size:11px;color:var(--muted);text-align:center;padding:2px}
  .cal .d{min-height:78px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff;font-size:11px;cursor:pointer;position:relative}
  .cal .d.out{opacity:.35}.cal .d.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .cal .d.sun{background:#fdf6f4}.cal .d .n{font-weight:600;font-size:12px;margin-bottom:2px}
  .chip{display:block;border-radius:5px;padding:1px 4px;margin-top:2px;font-size:10.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
  .chip.off{background:#ddd6cc;color:#6b6259;text-decoration:line-through}
  @media(max-width:600px){.cal .d{min-height:62px;padding:2px}.chip{font-size:9.5px;padding:1px 2px}}
  /* 체크리스트 */
  .ck{list-style:none;margin:0;padding:0}
  .ck li{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--line)}
  .ck li.h{background:var(--soft);font-weight:600;font-size:12.5px;padding:6px 8px;border-radius:6px;border:none;margin-top:8px;color:var(--muted)}
  .ck li input[type=checkbox]{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--accent2)}
  .ck li .t{flex:1}.ck li.dn .t{color:var(--muted);text-decoration:line-through}
  .ck li small{display:block;color:var(--muted);font-size:11px}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent2)}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .subtabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
  .subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  /* 로그인 */
  #login{max-width:420px;margin:48px auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px 32px 26px;box-shadow:0 10px 40px rgba(60,40,20,.08)}
  #login .logo{width:84px;height:84px;margin-bottom:18px}#login .logo img{width:100%;height:100%;object-fit:contain}
  #login .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent2);margin-bottom:6px}
  #login h1{font-size:28px;margin:0 0 8px;letter-spacing:-.01em}
  #login .sub{margin:0 0 22px;color:var(--muted);font-size:14.5px}
  #login .f{margin-bottom:14px}#login label{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
  #login input[type=text],#login input[type=password]{padding:14px 14px;font-size:16px;border-radius:12px;border:1.5px solid var(--line)}
  #login input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 4px rgba(90,125,106,.15)}
  #login .pw{position:relative}#login .pw input{padding-right:46px}#login .pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;font-size:18px;cursor:pointer;color:var(--muted)}
  #login .names{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}#login .nb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}#login .nb.on{background:var(--soft);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
  #login .err{min-height:18px;margin:0 0 6px;font-size:12.5px;color:var(--red)}
  #login .go{width:100%;padding:16px;font-size:17px;font-weight:700;border-radius:14px;background:var(--accent2);border-color:var(--accent2)}
  #login .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:12.5px;color:var(--muted)}
  #login .foot b{display:block;color:#a64b3c;margin-bottom:3px}#login .foot span{display:block}#login .foot .demo{margin-top:8px;font-size:11px;color:#b5aca3}
  @media(max-width:520px){#login{margin:16px 12px;padding:28px 22px 22px}#login h1{font-size:24px}}
  /* 모달 */
  .modal-bg{position:fixed;inset:0;background:rgba(40,30,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  @media(min-width:600px){.modal-bg{align-items:center}}
  .modal{background:#fff;border-radius:14px 14px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px}
  @media(min-width:600px){.modal{border-radius:14px}}
  .modal h2{font-size:16px;margin:0 0 12px}
  .modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;position:sticky;bottom:0;background:#fff;padding-top:8px}
  #toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
  #toast.on{opacity:1}
  .ev{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .ev .dt{width:64px;color:var(--muted);flex:none;font-size:12px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
  .ymonth{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .ymonth .m{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
  .ymonth .m h4{margin:0 0 6px;font-size:13px}
  .ymonth .m .ev{padding:3px 0;font-size:12px}
  .att-btns{display:flex;gap:10px}
  .flow .st{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
  .flow .st .ic{font-size:22px;width:30px;text-align:center}.flow .st .tx{flex:1}.flow .st .tx b{display:block;font-size:14px}.flow .st .tx small{color:var(--muted);font-size:12px}
  .flow .st.ok .tx b{color:var(--accent2)}.flow .st.ok .tx small{color:var(--accent2)}
  details.tipd{border:none;background:transparent;padding:0;margin:6px 0}details.tipd summary{font-weight:400;color:var(--muted);font-size:12px}details.tipd .tipbox{margin-top:6px}
  details.sg{margin:10px 0 0;padding:8px 10px}details.sg summary{font-size:13px}details.sg .stock{margin-top:8px}
  .ck li{cursor:pointer}.ck.edit li{cursor:default}.ck li.h{display:flex;align-items:center;gap:6px}.ck.edit li .btn{flex:none}
  .nm-r{font-weight:600}
  .clock{font-size:28px;font-weight:700;letter-spacing:.02em}
  @media(max-width:700px){
    header{padding:8px 12px}nav.top{display:none}header .me{font-size:11px;gap:5px}header h1 small{display:none}
    nav.bottom{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;height:var(--nav);background:#fff;border-top:1px solid var(--line);z-index:5;padding:4px 2px env(safe-area-inset-bottom)}
    nav.bottom button{border:none;border-radius:8px;padding:4px 0;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px}
    nav.bottom button b{font-size:18px;font-weight:400}
    nav.bottom button.on{color:var(--accent);background:var(--warn)}
    .two > div:first-child .list{max-height:180px}
  }
  @media print{header,nav,.noprint,#toast{display:none!important}body{background:#fff}.card{border:none;padding:0}main{padding:0}}
</style>
</head>
<body>
<header id="hdr" hidden>
  <h1><img src="assets/logo.png" alt="" class="hlogo" onerror="if(!this.dataset.n){this.dataset.n=1;this.src='assets/logo.jpg'}else{this.onerror=null;this.src='assets/logo.svg'}">카페스이 운영노트 <small id="modeTag"></small></h1>
  <nav class="top" id="navTop"></nav>
  <div class="me"><span id="meName"></span><button class="btn sm" id="gearBtn" title="설정">⚙️</button><button class="btn sm" id="logoutBtn">로그아웃</button></div>
</header>
<main id="view"></main>
<nav class="bottom" id="navBottom" hidden></nav>
<div id="toast"></div>

<!-- Firebase (compat) — config.js 가 있으면 사용 -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="js/config.js" onerror="console.info('config.js 없음 → 로컬 데모 모드')"></script>
<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
